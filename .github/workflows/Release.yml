name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only precheck, do not publish'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build Rust daemon (aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          bash scripts/build-daemon.sh
          test -x module/bin/bgfreeze
          file module/bin/bgfreeze | grep -E 'ARM aarch64|aarch64'

      - name: Publish KernelSU module
        uses: KernelSU-Modules/tools/actions/module-release@424471eacf6c0bd00e8e3708980f6b1882b5bf33
        with:
          module-dir: module
          release-notes-file: CHANGELOG.md
          require-immutable: 'true'
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
