name: Precheck

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build Rust daemon (aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          bash scripts/build-daemon.sh
          test -x module/bin/bgfreeze
          file module/bin/bgfreeze | grep -E 'ARM aarch64|aarch64'

      - name: Validate module layout and module.yaml
        run: |
          set -euo pipefail
          test -f module.yaml
          test -f module/module.prop
          test -f README.md
          test -x module/bin/bgfreeze
          id_prop=$(grep -E '^id=' module/module.prop | head -1 | cut -d= -f2-)
          id_yaml=$(grep -E '^id:' module.yaml | head -1 | awk '{print $2}')
          test -n "$id_prop"
          test "$id_prop" = "$id_yaml"
          for key in id name version versionCode author description; do
            grep -qE "^${key}=" module/module.prop
          done
          versionCode=$(grep -E '^versionCode=' module/module.prop | head -1 | cut -d= -f2-)
          test "$versionCode" -ge 1
          desc=$(grep -E '^description:' module.yaml | head -1 | awk '{print $2}')
          test -f "$desc"
          bash scripts/pack.sh
          ls -la dist/*.zip
          echo "OK id=$id_prop versionCode=$versionCode"
