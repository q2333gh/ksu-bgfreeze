# When main advances with a newer module.prop versionCode, create the matching
# v* tag. That tag push triggers Release → immutable KernelSU module publish.
name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag if versionCode is newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -E '^version=' module/module.prop | head -1 | cut -d= -f2- | tr -d '\r')
          versionCode=$(grep -E '^versionCode=' module/module.prop | head -1 | cut -d= -f2- | tr -d '\r')
          test -n "$version"
          test "$versionCode" -ge 1
          case "$version" in
            v*) tag="$version" ;;
            *) tag="v${version}" ;;
          esac

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — skip"
            exit 0
          fi

          # Max versionCode among published release assets named
          # ksu-bgfreeze-<code>-v*.zip (immutable catalog).
          latest_code=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '[.[].assets[].name
                | capture("^ksu-bgfreeze-(?<c>[0-9]+)-")
                | .c | tonumber] | max // 0'
          )
          echo "prop version=${version} versionCode=${versionCode} tag=${tag} latest_released_code=${latest_code}"

          if [ "${versionCode}" -le "${latest_code}" ]; then
            echo "versionCode ${versionCode} <= latest released ${latest_code} — no auto-tag (bump version+versionCode to ship)"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag} (versionCode ${versionCode})"
          git push origin "refs/tags/${tag}"
          echo "Pushed ${tag} — Release workflow will publish immutable zip"
