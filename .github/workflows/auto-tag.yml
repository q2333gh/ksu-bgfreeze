# When main advances with a newer module.prop versionCode, create the matching
# v* tag and dispatch Release. (GITHUB_TOKEN tag pushes do NOT trigger other
# workflows — so we explicitly `gh workflow run Release` after tagging.)
name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag if versionCode is newer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -E '^version=' module/module.prop | head -1 | cut -d= -f2- | tr -d '\r')
          versionCode=$(grep -E '^versionCode=' module/module.prop | head -1 | cut -d= -f2- | tr -d '\r')
          test -n "$version"
          test "$versionCode" -ge 1
          case "$version" in
            v*) tag="$version" ;;
            *) tag="v${version}" ;;
          esac

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — skip"
            exit 0
          fi

          latest_code=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '[.[].assets[].name
                | capture("^ksu-bgfreeze-(?<c>[0-9]+)-")
                | .c | tonumber] | max // 0'
          )
          echo "prop version=${version} versionCode=${versionCode} tag=${tag} latest_released_code=${latest_code}"

          if [ "${versionCode}" -le "${latest_code}" ]; then
            echo "versionCode ${versionCode} <= latest released ${latest_code} — no auto-tag (bump version+versionCode to ship)"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lightweight tag so refs/tags/* points at the commit. Annotated tags
          # point at a tag object; POST /releases with target_commitish=commit
          # then needs workflows:write (unavailable to GITHUB_TOKEN) when the
          # commit touches .github/workflows/.
          git tag "${tag}"
          git push origin "refs/tags/${tag}"

          # Tag pushes authenticated as GITHUB_TOKEN do not start other workflows.
          # Workflow file is Release.yml (case-sensitive on Linux runners).
          gh workflow run Release.yml --ref "${tag}" -f dry_run=false
          echo "Pushed ${tag} and dispatched Release workflow"
